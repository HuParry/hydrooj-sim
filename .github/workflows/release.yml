name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag (for example v0.2.11)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: sim-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'HuParry/hydrooj-sim'
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check version and create installation archive
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const pkg = require('./package.json');
          if (pkg.name !== 'hydrooj-sim') throw new Error('Unexpected package name');
          if (process.env.RELEASE_TAG !== `v${pkg.version}`) {
            throw new Error(`Tag ${process.env.RELEASE_TAG} does not match package version ${pkg.version}`);
          }
          fs.mkdirSync('dist', { recursive: true });
          const [pack] = JSON.parse(execFileSync('npm', [
            'pack', '--json', '--ignore-scripts', '--pack-destination', 'dist',
          ], { encoding: 'utf8', maxBuffer: 16 * 1024 * 1024 }));
          const files = new Map(pack.files.map(file => [file.path, file]));
          for (const file of [
            'package.json', 'index.ts', 'template/sim.html', 'LICENSE',
            'lib/jplag-6.2.0-jar-with-dependencies.jar', 'lib/JPLAG-LICENSE.txt',
            'lib/vendor/jsdiff.js', 'lib/vendor/JSDIFF-LICENSE.txt',
            'lib/vendor/adm-zip/adm-zip.js', 'lib/vendor/adm-zip/LICENSE',
            'runtime/linux-x64/bin/java', 'runtime/linux-x64/lib/modules',
            'runtime/linux-x64/lib/ct.sym',
          ]) {
            if (!files.get(file)?.size) throw new Error(`Missing or empty in archive: ${file}`);
          }
          if (!(files.get('runtime/linux-x64/bin/java').mode & 0o111)) {
            throw new Error('Bundled Java is not executable in archive');
          }
          fs.appendFileSync(process.env.GITHUB_ENV, `RELEASE_ASSET=dist/${pack.filename}\n`);
          NODE

      - name: Create checksum
        run: |
          cd dist
          sha256sum "${RELEASE_ASSET#dist/}" > SHA256SUMS

      - name: Upload installation archive to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RELEASE_ASSET" dist/SHA256SUMS --clobber
          else
            options=(--verify-tag --generate-notes --title "$RELEASE_TAG")
            if [[ "$RELEASE_TAG" == *-* ]]; then
              options+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "$RELEASE_ASSET" dist/SHA256SUMS "${options[@]}"
          fi
