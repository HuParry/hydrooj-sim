<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hydrooj-sim · 比赛代码查重</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <header><a class="brand" href="/">hydrooj-sim</a><span class="badge">独立版</span></header>
    <section class="intro"><p class="eyebrow">CONTEST CODE SIMILARITY</p><h1>比赛代码查重</h1><p>上传 Hydro OJ 导出的比赛代码，按题目与语言自动比较。</p></section>
    <section class="panel">
      <form id="upload-form">
        <label for="archive">比赛代码压缩包</label>
        <div class="upload"><input id="archive" type="file" accept=".zip,application/zip" required><p class="muted">从 Hydro 比赛管理页面导出的 ZIP，最大 128 MiB。</p></div>
        <div class="fields">
          <div><label for="threshold">相似度阈值（%）</label><input id="threshold" type="number" min="0" max="100" step="1" value="50" required></div>
        </div>
        <div class="actions"><button id="start" type="submit">开始查重</button><span class="muted">提交后可保留本页链接，稍后回来查看结果。</span></div>
      </form>
      <p id="error" role="alert" hidden></p>
    </section>
    <section id="progress-section" class="panel" aria-live="polite" hidden>
      <div class="progress-heading"><h2>查重进度</h2><span id="percent"></span></div>
      <progress id="progress" max="100"></progress><p id="status" class="muted"></p>
      <button id="delete-job" type="button" class="secondary" hidden>删除此任务</button>
    </section>
    <section id="results-section" hidden><div class="results-heading"><h2>查重结果</h2><button id="download" type="button" class="secondary">下载结果 JSON</button></div><div id="results"></div></section>
    <footer><a href="https://github.com/HuParry/hydrooj-sim" target="_blank" rel="noopener noreferrer">hydrooj-sim</a> · © 2026 HuParry · <a href="https://github.com/HuParry/hydrooj-sim/blob/HEAD/LICENSE" target="_blank" rel="noopener noreferrer">AGPL-3.0-or-later</a></footer>
  </main>
  <dialog id="diff-dialog" aria-labelledby="diff-title"><div class="dialog-panel"><div class="dialog-heading"><h2 id="diff-title">提交代码对比</h2><button id="close-diff" type="button" class="secondary">关闭</button></div><div class="diff-titles"><div id="diff-left"></div><div id="diff-right"></div></div><div id="diff-content" class="diff-scroll"></div></div></dialog>
</body>
</html>
